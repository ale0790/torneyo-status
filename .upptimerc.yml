# Upptime (https://upptime.js.org) - monitor de disponibilidade do Torneyo
# Historico de sondagens versionado em git = disponibilidade comprovavel para editais
# (Varginha 95% / Santa Rita do Sapucai 97%).
owner: ale0790
repo: torneyo-status

sites:
  - name: Website
    url: https://torneyo.com
  - name: App
    url: https://app.torneyo.com
  # API (health enxuto): adicionar quando a issue ale0790/Torneyo#1705 expuser
  # https://app.torneyo.com/api/actuator/health respondendo 200 {"status":"UP"}
  # - name: API
  #   url: https://app.torneyo.com/api/actuator/health
  #   expectedStatusCodes:
  #     - 200

status-website:
  baseUrl: /torneyo-status
  logoUrl: https://torneyo.com/favicon.svg
  name: Torneyo Status
  introTitle: "Status dos servicos **Torneyo**"
  introMessage: Monitoramento externo e independente (GitHub Actions, a cada ~5 min). Historico completo e auditavel no [repositorio](https://github.com/ale0790/torneyo-status).
  navbar:
    - title: Status
      href: /
    - title: Site
      href: https://torneyo.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  activeIncidents: Incidentes ativos
  allSystemsOperational: Todos os sistemas operacionais
  degradedPerformance: desempenho degradado
  down: fora do ar
  up: no ar

# Notificacoes: issues sao abertas automaticamente neste repo quando um site cai.
# Ver https://upptime.js.org/docs/configuration para e-mail/Telegram via secrets.
